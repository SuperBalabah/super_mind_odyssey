<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="entropyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Circle aura -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.4" />
  <circle cx="50" cy="50" r="36" fill="#082f49" fill-opacity="0.6" stroke="#38bdf8" stroke-width="1" />
  
  <!-- Hourglass / Dissipative Crystal Structure -->
  <polygon points="30,26 70,26 55,48 50,52 45,48" fill="url(#entropyGrad)" filter="url(#cyanGlow)" opacity="0.9" />
  <polygon points="50,48 55,52 70,74 30,74 45,52" fill="url(#entropyGrad)" filter="url(#cyanGlow)" opacity="0.8" />
  
  <!-- Reversal Arrows (Anti-entropy flow) -->
  <path d="M50,70 L50,30" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2,3" />
  <polyline points="46,36 50,30 54,36" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Cosmic Order Sparkles -->
  <circle cx="50" cy="20" r="2.5" fill="#f8fafc" />
  <circle cx="50" cy="80" r="2" fill="#38bdf8" />
  <circle cx="26" cy="50" r="1.5" fill="#bae6fd" />
  <circle cx="74" cy="50" r="1.5" fill="#bae6fd" />
</svg>
