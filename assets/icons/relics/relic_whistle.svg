<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="silver-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <radialGradient id="sonic-wave" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06D6A0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#06D6A0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="50" cy="50" r="46" fill="url(#sonic-wave)"/>
  <!-- Sonic Shockwave Arcs -->
  <path d="M68 28 A 30 30 0 0 1 84 50" stroke="#06D6A0" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M74 22 A 40 40 0 0 1 92 50" stroke="#06D6A0" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <!-- Whistle Body (Side profile) -->
  <path d="M18 42 L42 42 C48 30, 68 30, 72 44 C76 56, 68 68, 54 68 L32 68 L18 54 Z" 
        fill="url(#silver-metal)" stroke="#F8FAFC" stroke-width="1.5"/>
  <!-- Whistle Chamber Core (Pea sphere chamber) -->
  <circle cx="58" cy="50" r="10" fill="#0F172A" stroke="#94A3B8" stroke-width="1.5"/>
  <circle cx="58" cy="50" r="4" fill="#06D6A0"/>
  <!-- Lanyard Loop -->
  <circle cx="16" cy="48" r="4" stroke="url(#silver-metal)" stroke-width="2"/>
  <!-- Air slot opening -->
  <rect x="36" y="38" width="6" height="8" rx="1" fill="#0F172A"/>
</svg>
