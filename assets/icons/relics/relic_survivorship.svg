<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Reticle Outer Ring -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4" />
  <circle cx="50" cy="50" r="35" fill="#451a03" fill-opacity="0.6" stroke="#fbbf24" stroke-width="1.2" />

  <!-- The Lens / Monocle for Seeing Hidden Truth -->
  <circle cx="50" cy="50" r="26" fill="none" stroke="url(#amberGrad)" stroke-width="3" filter="url(#goldGlow)" />
  <ellipse cx="44" cy="42" rx="16" ry="8" fill="#fef3c7" fill-opacity="0.25" transform="rotate(-30 44 42)" />

  <!-- Crosshairs -->
  <line x1="16" y1="50" x2="30" y2="50" stroke="#fef08a" stroke-width="1.8" />
  <line x1="70" y1="50" x2="84" y2="50" stroke="#fef08a" stroke-width="1.8" />
  <line x1="50" y1="16" x2="50" y2="30" stroke="#fef08a" stroke-width="1.8" />
  <line x1="50" y1="70" x2="50" y2="84" stroke="#fef08a" stroke-width="1.8" />

  <!-- Hidden bullet impact holes (the missing data) -->
  <circle cx="50" cy="50" r="4" fill="#ef4444" stroke="#ffffff" stroke-width="1" />
  <circle cx="38" cy="45" r="2" fill="#ef4444" opacity="0.8" />
  <circle cx="62" cy="55" r="2" fill="#ef4444" opacity="0.8" />
</svg>
