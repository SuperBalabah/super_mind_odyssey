<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="compass-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFC857" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFC857" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="50%" stop-color="#FF9A3C"/>
      <stop offset="100%" stop-color="#A23B72"/>
    </linearGradient>
    <linearGradient id="needle-north" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#48CAE4"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </linearGradient>
    <linearGradient id="needle-south" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F72585"/>
      <stop offset="100%" stop-color="#7209B7"/>
    </linearGradient>
  </defs>
  <!-- Outer Glow -->
  <circle cx="50" cy="50" r="48" fill="url(#compass-glow)"/>
  <!-- Outer Brass Ring with Marks -->
  <circle cx="50" cy="50" r="42" stroke="url(#gold-rim)" stroke-width="3" fill="#0A0E1A" fill-opacity="0.9"/>
  <circle cx="50" cy="50" r="37" stroke="#FFC857" stroke-width="1" stroke-dasharray="2,3"/>
  <!-- Cardinal Star Points -->
  <path d="M50 14 L52 24 L50 22 L48 24 Z" fill="#FFD166"/>
  <path d="M50 86 L52 76 L50 78 L48 76 Z" fill="#A23B72"/>
  <path d="M14 50 L24 52 L22 50 L24 48 Z" fill="#FFD166"/>
  <path d="M86 50 L76 52 L78 50 L76 48 Z" fill="#FFD166"/>
  <!-- Navigation Lines -->
  <line x1="50" y1="26" x2="50" y2="74" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <line x1="26" y1="50" x2="74" y2="50" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <!-- Needle: North (Cyan) & South (Purple) -->
  <polygon points="50,20 55,50 50,47 45,50" fill="url(#needle-north)"/>
  <polygon points="50,80 55,50 50,53 45,50" fill="url(#needle-south)"/>
  <!-- Center Jewel & Hub -->
  <circle cx="50" cy="50" r="6" fill="#07090E" stroke="#FFD166" stroke-width="2"/>
  <circle cx="50" cy="50" r="2.5" fill="#48CAE4"/>
</svg>
